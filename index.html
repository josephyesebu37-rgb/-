<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>తెలుగు బైబిల్ & AI (Gemini 2.0)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Mandali&family=Ramabhadra&display=swap');
        body { font-family: 'Mandali', sans-serif; background-color: #f3f4f6; }
        .verse-num { color: #d97706; font-weight: bold; margin-right: 5px; font-size: 0.9em; }
        .verse-text { line-height: 1.8; font-size: 1.1rem; }
        
        /* AI Response Styles */
        .ai-response { white-space: pre-wrap; line-height: 1.6; font-size: 1rem; color: #374151; }
        .ai-response h1, .ai-response h2 { font-weight: bold; margin-top: 10px; color: #1e3a8a; }
        .ai-response strong { color: #b45309; }
        
        /* Cartoon Mode Styles - Fun fonts & colors */
        .cartoon-mode { 
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif; 
            color: #4b5563; 
            background-color: #fffbeb; 
            border: 3px dashed #f59e0b; 
            padding: 15px; 
            border-radius: 15px; 
            box-shadow: 5px 5px 0px #fcd34d;
        }

        /* Real Life Mode Styles */
        .real-life-mode {
            background-color: #ecfdf5;
            border-left: 5px solid #10b981;
            padding: 15px;
            border-radius: 5px;
        }
        
        /* Loader */
        .loader {
            border: 4px solid #f3f3f3; border-top: 4px solid #3b82f6; border-radius: 50%;
            width: 30px; height: 30px; animation: spin 1s linear infinite; display: inline-block;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Hide scrollbar */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden relative">

    <!-- Header -->
    <header class="bg-blue-900 text-white p-4 shadow-md z-10 flex justify-between items-center">
        <h1 class="text-xl md:text-2xl font-bold font-['Ramabhadra']">పవిత్ర గ్రంథము</h1>
    </header>

    <!-- Navigation Controls -->
    <div id="app-controls" class="hidden bg-white shadow-sm border-b p-3">
        <div class="max-w-4xl mx-auto flex flex-col md:flex-row gap-3">
            <div class="flex gap-2 flex-1">
                <select id="bookSelect" class="bg-gray-100 border rounded p-2 flex-1 text-gray-800 font-bold focus:outline-none focus:ring-2 focus:ring-blue-500"></select>
                <select id="chapterSelect" class="bg-gray-100 border rounded p-2 w-24 text-gray-800 font-bold focus:outline-none focus:ring-2 focus:ring-blue-500"></select>
            </div>
            <div class="relative flex-1">
                <input type="text" id="searchInput" placeholder="శోధించండి (ఉదా: దావీదు)..." class="w-full border rounded p-2 pl-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button id="searchBtn" class="absolute right-1 top-1 bg-blue-100 text-blue-800 px-3 py-1 rounded hover:bg-blue-200">🔍</button>
            </div>
        </div>
    </div>

    <!-- Main Content Area -->
    <main class="flex-1 overflow-y-auto p-4 max-w-4xl mx-auto w-full relative pb-24">
        
        <!-- Welcome / Loading Screen -->
        <div id="welcome-screen" class="flex flex-col items-center justify-center h-full text-center text-gray-500">
            <div id="initial-loader" class="loader mb-4"></div>
            <h2 id="welcome-msg" class="text-xl font-bold text-gray-700 mb-2">బైబిల్ డేటా లోడ్ అవుతోంది...</h2>
            
            <!-- Manual Upload Fallback -->
            <div id="manual-upload-prompt" class="hidden mt-6 bg-white p-6 rounded shadow border border-red-100">
                <p class="text-red-600 font-bold mb-2">⚠ ఆన్లైన్ డేటా అందలేదు</p>
                <label class="cursor-pointer bg-blue-600 text-white px-4 py-2 rounded shadow hover:bg-blue-700">
                    📂 ఫైల్ సెలెక్ట్ చేయండి
                    <input type="file" id="jsonFileManual" accept=".json" class="hidden">
                </label>
            </div>
        </div>

        <!-- Verse Container -->
        <div id="verses-container" class="hidden space-y-4"></div>

        <!-- Search Results -->
        <div id="search-results" class="hidden space-y-4">
            <div class="flex justify-between items-center border-b pb-2 mb-4">
                <h3 class="font-bold text-lg text-blue-900">శోధన ఫలితాలు</h3>
                <span id="search-stats" class="bg-yellow-100 text-yellow-800 text-sm font-bold px-2 py-1 rounded"></span>
            </div>
            <div id="search-list" class="space-y-3"></div>
        </div>
    </main>

    <!-- AI Floating Button -->
    <button id="ai-fab" onclick="toggleAIPanel()" class="hidden fixed bottom-20 right-5 bg-gradient-to-r from-indigo-600 to-purple-600 text-white p-4 rounded-full shadow-lg z-20 flex items-center gap-2 hover:scale-110 transition duration-300">
        <span class="text-2xl">✨</span> <span class="font-bold hidden md:inline">AI సహాయం</span>
    </button>

    <!-- AI Panel (Slide-in) -->
    <div id="ai-panel" class="fixed inset-y-0 right-0 w-full md:w-96 bg-white shadow-2xl transform translate-x-full transition-transform duration-300 z-30 flex flex-col">
        <div class="bg-indigo-900 text-white p-4 flex justify-between items-center">
            <h2 class="font-bold text-lg">✨ AI ఆత్మీయ సహాయకుడు</h2>
            <button onclick="toggleAIPanel()" class="text-white text-2xl hover:text-red-300">&times;</button>
        </div>

        <div class="flex-1 overflow-y-auto p-4 space-y-3">
            <div class="bg-indigo-50 p-3 rounded text-sm text-indigo-800 mb-2 border border-indigo-100">
                సందర్భం: <span id="ai-current-context" class="font-bold">-</span>
            </div>
            
            <!-- Real Life Example Button -->
            <button onclick="askGemini('real_life')" class="w-full bg-white border border-green-300 p-3 rounded hover:bg-green-50 text-left flex items-center gap-3 shadow-sm group transition">
                <span class="text-2xl group-hover:scale-110 transition">🌍</span>
                <div>
                    <div class="font-bold text-gray-800">నిజ జీవిత ఉదాహరణ</div>
                    <div class="text-xs text-gray-500">ఈ రోజుల్లో దీనిని ఎలా అన్వయించుకోవాలి?</div>
                </div>
            </button>

            <!-- Cartoon Story Button -->
            <button onclick="askGemini('cartoon')" class="w-full bg-white border border-yellow-400 p-3 rounded hover:bg-yellow-50 text-left flex items-center gap-3 shadow-sm group transition">
                <span class="text-2xl group-hover:scale-110 transition">🦁</span>
                <div>
                    <div class="font-bold text-gray-800">పిల్లల కార్టూన్ కథ</div>
                    <div class="text-xs text-gray-500">ఎమోజీలు & సౌండ్ ఎఫెక్ట్స్ తో ఫన్నీగా...</div>
                </div>
            </button>

            <!-- Other Options -->
            <div class="grid grid-cols-2 gap-2">
                <button onclick="askGemini('summary')" class="bg-white border p-3 rounded hover:bg-gray-50 text-center font-bold text-gray-700 text-sm">📝 సారాంశం</button>
                <button onclick="askGemini('devotional')" class="bg-white border p-3 rounded hover:bg-gray-50 text-center font-bold text-gray-700 text-sm">🙏 దైవ సందేశం</button>
            </div>

            <!-- Custom Question -->
            <div class="mt-4 pt-4 border-t">
                <input type="text" id="ai-question-input" placeholder="మీ సందేహం అడగండి..." class="w-full border rounded p-2 mb-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                <button onclick="askGemini('custom')" class="bg-indigo-600 text-white px-4 py-2 w-full rounded hover:bg-indigo-700 transition font-bold">పంపించు ➤</button>
            </div>

            <!-- Loader & Response Area -->
            <div id="ai-loader" class="hidden text-center py-8">
                <div class="loader"></div>
                <p class="text-xs text-gray-500 mt-2 font-bold animate-pulse">Gemini 2.0 ఆలోచిస్తుంది...</p>
            </div>
            <div id="ai-content" class="text-sm mt-4 hidden p-2"></div>
        </div>
    </div>

    <!-- Footer Navigation -->
    <footer id="nav-footer" class="hidden bg-white border-t p-3 fixed bottom-0 w-full shadow-lg z-10 flex justify-between max-w-4xl mx-auto left-0 right-0">
        <button id="prevChapter" class="bg-gray-200 text-gray-700 px-4 py-2 rounded font-bold shadow-sm">⬅ వెనుకకు</button>
        <button id="nextChapter" class="bg-blue-600 text-white px-4 py-2 rounded font-bold shadow-sm hover:bg-blue-700">ముందుకు ➡</button>
    </footer>

    <script>
        // --- 1. CONFIGURATION ---
        // 🚨 YOUR API KEY HARDCODED HERE AS REQUESTED 🚨
        const apiKey = "AIzaSyCkbWm2BZfk8trvEav_XW-N11sb-IK3PhY"; 
        
        let bibleData = null;
        let currentBookIndex = 0;
        let currentChapterIndex = 0;
        
        // Telugu Book Names (Hardcoded because JSON lacks them)
        const teluguBookNames = [
            "ఆదికాండము", "నిర్గమకాండము", "లేవీయకాండము", "సంఖ్యాకాండము", "ద్వితీయోపదేశకాండము", "యెహోషువ", "న్యాయాధిపతులు", "రూతు", "1 సమూయేలు", "2 సమూయేలు", 
            "1 రాజులు", "2 రాజులు", "1 దినవృత్తాంతములు", "2 దినవృత్తాంతములు", "ఎజ్రా", "నెహెమ్యా", "ఎస్తేరు", "యోబు", "కీర్తనల గ్రంథము", "సామెతలు", 
            "ప్రసంగి", "పరమగీతము", "యెషయా", "యిర్మియా", "విలాపవాక్యములు", "యెహెజ్కేలు", "దానియేలు", "హోషేయ", "యోవేలు", "ఆమోసు", "ఓబధ్యా", 
            "యోనా", "మీకా", "నహూము", "హబక్కూకు", "జెఫన్యా", "హగ్గయి", "జెకర్యా", "మలాకీ",
            "మత్తయి సువార్త", "మార్కు సువార్త", "లూకా సువార్త", "యోహాను సువార్త", "అపొస్తలుల కార్యములు", "రోమీయులకు", "1 కోరింథీయులకు", "2 కోరింథీయులకు", "గలతీయులకు", "ఎఫెసీయులకు", "ఫిలిప్పీయులకు", 
            "కొలొస్సయులకు", "1 థెస్సలొనీకయులకు", "2 థెస్సలొనీకయులకు", "1 తిమోతికి", "2 తిమోతికి", "తీతుకు", "ఫిలేమోనుకు", "హెబ్రీయులకు", "యాకోబు", "1 పేతురు", "2 పేతురు", 
            "1 యోహాను", "2 యోహాను", "3 యోహాను", "యూదా", "ప్రకటన గ్రంథము"
        ];

        // --- 2. AUTO LOAD LOGIC ---
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                // Assuming bible.json is in the same folder
                const response = await fetch('bible.json');
                if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
                const json = await response.json();
                if (json.Book && Array.isArray(json.Book)) {
                    bibleData = json.Book;
                    initializeUI();
                } else throw new Error("Invalid JSON Format");
            } catch (error) {
                console.error("Auto-load failed:", error);
                document.getElementById('initial-loader').classList.add('hidden');
                document.getElementById('manual-upload-prompt').classList.remove('hidden');
            }
        });

        document.getElementById('jsonFileManual').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const json = JSON.parse(evt.target.result);
                    if (json.Book && Array.isArray(json.Book)) {
                        bibleData = json.Book;
                        initializeUI();
                    } else alert("Invalid JSON");
                } catch(err) { alert("File Error"); }
            };
            reader.readAsText(file);
        });

        // --- 3. UI INITIALIZATION & NAVIGATION ---
        function initializeUI() {
            document.getElementById('welcome-screen').classList.add('hidden');
            document.getElementById('app-controls').classList.remove('hidden');
            document.getElementById('nav-footer').classList.remove('hidden');
            document.getElementById('ai-fab').classList.remove('hidden');
            populateBooks();
            loadChapter(0, 0);
        }

        function populateBooks() {
            const select = document.getElementById('bookSelect');
            select.innerHTML = '';
            bibleData.forEach((_, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = teluguBookNames[index] || `పుస్తకం ${index + 1}`;
                select.appendChild(option);
            });
        }

        function populateChapters(bookIdx) {
            const select = document.getElementById('chapterSelect');
            select.innerHTML = '';
            const chapters = bibleData[bookIdx].Chapter;
            chapters.forEach((_, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = index + 1;
                select.appendChild(option);
            });
            select.value = currentChapterIndex;
        }

        function loadChapter(bookIdx, chapIdx) {
            currentBookIndex = parseInt(bookIdx);
            currentChapterIndex = parseInt(chapIdx);
            
            document.getElementById('bookSelect').value = currentBookIndex;
            populateChapters(currentBookIndex);
            
            const name = teluguBookNames[currentBookIndex] || `Book ${currentBookIndex+1}`;
            document.getElementById('ai-current-context').textContent = `${name} - ${currentChapterIndex + 1}`;

            const container = document.getElementById('verses-container');
            container.innerHTML = '';
            container.classList.remove('hidden');
            document.getElementById('search-results').classList.add('hidden');

            const chapterData = bibleData[currentBookIndex].Chapter[currentChapterIndex];
            if(chapterData && chapterData.Verse) {
                chapterData.Verse.forEach((v, idx) => {
                    const div = document.createElement('div');
                    div.className = "bg-white p-3 rounded shadow-sm border border-gray-100 mb-2";
                    div.innerHTML = `<span class="verse-num">${idx+1}</span><span class="verse-text text-gray-800">${v.Verse}</span>`;
                    container.appendChild(div);
                });
            }
            window.scrollTo(0,0);
            updateNav();
        }

        function updateNav() {
            document.getElementById('prevChapter').disabled = (currentBookIndex === 0 && currentChapterIndex === 0);
            const lastBookIdx = bibleData.length - 1;
            const lastChapIdx = bibleData[lastBookIdx].Chapter.length - 1;
            document.getElementById('nextChapter').disabled = (currentBookIndex === lastBookIdx && currentChapterIndex === lastChapIdx);
        }

        document.getElementById('bookSelect').onchange = (e) => loadChapter(e.target.value, 0);
        document.getElementById('chapterSelect').onchange = (e) => loadChapter(currentBookIndex, e.target.value);
        document.getElementById('prevChapter').onclick = () => {
            if(currentChapterIndex > 0) loadChapter(currentBookIndex, currentChapterIndex - 1);
            else if(currentBookIndex > 0) {
                const prevChaps = bibleData[currentBookIndex - 1].Chapter.length;
                loadChapter(currentBookIndex - 1, prevChaps - 1);
            }
        };
        document.getElementById('nextChapter').onclick = () => {
            const chaps = bibleData[currentBookIndex].Chapter.length;
            if(currentChapterIndex < chaps - 1) loadChapter(currentBookIndex, currentChapterIndex + 1);
            else if(currentBookIndex < bibleData.length - 1) loadChapter(currentBookIndex + 1, 0);
        };

        // --- 4. SEARCH FUNCTIONALITY ---
        document.getElementById('searchBtn').onclick = performSearch;
        document.getElementById('searchInput').onkeypress = (e) => { if(e.key==='Enter') performSearch(); };

        function performSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if(!query) return;
            
            document.getElementById('verses-container').classList.add('hidden');
            const resDiv = document.getElementById('search-results');
            resDiv.classList.remove('hidden');
            const list = document.getElementById('search-list');
            const stats = document.getElementById('search-stats');
            
            list.innerHTML = '<div class="text-center py-4"><div class="loader"></div><p>వెతుకుతున్నాను...</p></div>';
            stats.innerText = '';

            setTimeout(() => {
                list.innerHTML = '';
                let count = 0;
                let resultsHTML = '';

                bibleData.forEach((book, bIdx) => {
                    const bName = teluguBookNames[bIdx] || `Book ${bIdx+1}`;
                    book.Chapter.forEach((ch, cIdx) => {
                        ch.Verse.forEach((v, vIdx) => {
                            if(v.Verse.includes(query)) {
                                count++;
                                const highlightedText = v.Verse.replace(new RegExp(query, 'gi'), match => `<span class="bg-yellow-200 font-bold">${match}</span>`);
                                resultsHTML += `
                                    <div onclick="loadChapter(${bIdx}, ${cIdx})" class="bg-white p-3 rounded border-l-4 border-blue-500 shadow-sm cursor-pointer hover:bg-blue-50 transition">
                                        <div class="text-xs text-blue-600 font-bold mb-1">${bName} ${cIdx+1}:${vIdx+1}</div>
                                        <div class="text-gray-700 text-sm leading-relaxed">${highlightedText}</div>
                                    </div>
                                `;
                            }
                        });
                    });
                });

                if(count === 0) {
                    list.innerHTML = '<div class="text-red-500 text-center p-4">ఫలితాలు ఏమీ దొరకలేదు.</div>';
                    stats.innerText = '0 ఫలితాలు';
                } else {
                    list.innerHTML = resultsHTML;
                    stats.innerText = `${count} ఫలితాలు`;
                }
            }, 50);
        }

        // --- 5. AI LOGIC (GEMINI 2.0 FLASH) ---
        function toggleAIPanel() { document.getElementById('ai-panel').classList.toggle('translate-x-full'); }
        
        async function askGemini(type) {
            const contentDiv = document.getElementById('ai-content');
            const loader = document.getElementById('ai-loader');
            const inputVal = document.getElementById('ai-question-input').value;

            if(!bibleData) { alert("ముందు డేటా లోడ్ చేయండి."); return; }

            const bName = teluguBookNames[currentBookIndex];
            const verses = bibleData[currentBookIndex].Chapter[currentChapterIndex].Verse.map(v => v.Verse).join('\n').substring(0, 15000);
            
            // CONSTRUCT PROMPTS
            let systemPrompt = "You are a helpful Telugu Christian Assistant. Always answer in Telugu.";
            let userPrompt = `Context: Bible Book '${bName}' Chapter ${currentChapterIndex+1}.\n\nBible Text:\n${verses}\n\n`;

            if(type === 'real_life') {
                userPrompt += `Task: ఈ అధ్యాయంలోని నీతిని, ఈ రోజుల్లో (2025లో) ఒక సామాన్య మనిషి తన ఆఫీసులోనో, కుటుంబంలోనో లేదా సమాజంలోనో ఎలా పాటించాలో ఒక "Real Life Example" (నిజ జీవిత ఉదాహరణ) ద్వారా వివరించు. తెలుగులో చెప్పు.`;
            } else if(type === 'cartoon') {
                userPrompt += `Task: ఈ అధ్యాయాన్ని 5 ఏళ్ల పిల్లల కోసం ఒక ఫన్నీ "Cartoon Script" లాగా మార్చు.
                Rules:
                1. ఎమోజీలు ఎక్కువగా వాడు (🦁, ⚡, 🌊).
                2. సౌండ్ ఎఫెక్ట్స్ రాయి (ఉదా: ఢమాల్!, టap టap, భయ్ భయ్).
                3. భాష చాలా సరళంగా, ఉత్సాహంగా ఉండాలి.
                4. చివరగా పిల్లల కోసం చిన్న నీతి చెప్పు.`;
            } else if(type === 'summary') {
                userPrompt += "Task: ఈ అధ్యాయం యొక్క సారాంశాన్ని క్లుప్తంగా తెలుగులో వివరించు.";
            } else if(type === 'devotional') {
                userPrompt += "Task: ఈ రోజుకు సరిపడే ఒక ఆత్మీయ సందేశం (Devotional) మరియు చిన్న ప్రార్థన రాయి.";
            } else {
                if(!inputVal) { alert("ప్రశ్న అడగండి"); return; }
                userPrompt += `User Question: ${inputVal}\nAnswer in Telugu based on the text.`;
            }

            // UI Updates
            contentDiv.classList.add('hidden');
            loader.classList.remove('hidden');

            try {
                // Using Gemini 2.0 Flash as requested
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: userPrompt }] }]
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error?.message || "API Error");
                }

                const data = await response.json();
                const aiText = data.candidates[0].content.parts[0].text;

                // Formatting
                let formattedText = aiText
                    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                    .replace(/\* /g, '• ')
                    .replace(/\n/g, '<br>');

                // Styling based on type
                contentDiv.className = "text-sm mt-4 p-4 rounded ai-response overflow-auto";
                if(type === 'cartoon') {
                    contentDiv.classList.add('cartoon-mode');
                    contentDiv.classList.remove('bg-gray-50', 'real-life-mode');
                } else if(type === 'real_life') {
                    contentDiv.classList.add('real-life-mode');
                    contentDiv.classList.remove('bg-gray-50', 'cartoon-mode');
                } else {
                    contentDiv.classList.add('bg-gray-50', 'border');
                    contentDiv.classList.remove('cartoon-mode', 'real-life-mode');
                }

                contentDiv.innerHTML = formattedText;
                contentDiv.classList.remove('hidden');

            } catch (error) {
                console.error(error);
                contentDiv.className = "bg-red-50 p-4 rounded border text-sm mt-4 text-red-600";
                contentDiv.innerHTML = `<strong>Error:</strong> ${error.message}<br>కీ బ్లాక్ అయ్యి ఉండవచ్చు లేదా కోటా అయిపోయి ఉండవచ్చు.`;
                contentDiv.classList.remove('hidden');
            } finally {
                loader.classList.add('hidden');
            }
        }
    </script>
</body>
